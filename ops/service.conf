# Reviewed bootstrap drop-in; never installed automatically by an artifact.
[Service]
WorkingDirectory=/opt/money-transfer-bot/current
ExecStart=
ExecStart=/usr/bin/node /opt/money-transfer-bot/current/dist/app.js
Environment=BOT_LIFECYCLE_SOCKET=/run/money-transfer-bot/lifecycle.sock
Environment=BOT_RELEASE_FILE=/opt/money-transfer-bot/current/RELEASE_SHA
RuntimeDirectory=money-transfer-bot
RuntimeDirectoryMode=0700
TimeoutStopSec=150
SendSIGKILL=no
